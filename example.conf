# open-ndi-monitor configuration
# Copy this file to ndi-monitor.conf in the same directory as the binary
# or specify a custom path with --config <path>

# NDI source name to connect to (leave empty to select from list)
source_name=

# Fullscreen mode (true/false)
fullscreen=true

# Display index (0 = primary monitor)
display_index=0

# Audio device (leave empty for auto-detect HDMI, or specify e.g. hw:0,7)
audio_device=
